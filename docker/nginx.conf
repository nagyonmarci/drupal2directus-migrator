server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API reverse proxy → FastAPI backend
    # ${API_UPSTREAM} is substituted at container startup via envsubst.
    # Default: http://api:8000 (Docker Compose service name).
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE support (disable buffering for log streaming)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — all other routes served from index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access log for health checks
    location = /api/health {
        proxy_pass ${API_UPSTREAM};
        access_log off;
    }
}
